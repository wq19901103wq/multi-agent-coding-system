[project]
name = "mac-system"
version = "0.1.0"
description = "Mobile Codex project host with Feishu integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark-oapi>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.20.0",
    "SQLAlchemy>=2.0.14",
    "sqlmodel>=0.0.22",
    "tomli>=2.0.1; python_version < '3.11'",
    "click>=8.1.0",
    "jsonschema>=4.23.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

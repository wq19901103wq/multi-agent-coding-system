name: Local regression baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m compileall -q src tests scripts
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest tests/ -q
      - run: python -m build
      - run: python scripts/prepare_source_release.py --output dist/mac-system-source.tar.gz
